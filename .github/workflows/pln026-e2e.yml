name: PLN-026 E2E, nightly and release gate

on:
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: full
        type: choice
        options:
          - full
          - release
  workflow_call:
    # Reusable workflows do not support `type: choice`. The accepted values are
    # `full` and `release`, validated in the preflight job below.
    inputs:
      mode:
        description: "Run mode (full or release)"
        required: false
        default: full
        type: string
    secrets:
      PLN026_STAGING_URL:
        required: false
      E2E_TEST_PASSWORD:
        required: false
      E2E_SERVICE_TOKEN:
        required: false
      E2E_WEBHOOK_SECRET:
        required: false
      E2E_GITHUB_WEBHOOK_SECRET:
        required: false
      E2E_MAILPIT_URL:
        required: false

permissions:
  contents: read
  actions: read
  issues: read

concurrency:
  group: pln026-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Full, nightly, release and reusable-call runs target staging. Local is only
  # an explicit opt-in in the PR validation job.
  E2E_ENV: staging
  PLN026_RELEASE: ${{ github.event_name == 'release' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.mode == 'release') }}

jobs:
  preflight:
    name: Staging/release configuration preflight
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLN026_STAGING_URL: ${{ secrets.PLN026_STAGING_URL || vars.PLN026_STAGING_URL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_SERVICE_TOKEN: ${{ secrets.E2E_SERVICE_TOKEN }}
      E2E_WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
      E2E_GITHUB_MOCK_URL: http://127.0.0.1:8787
      E2E_GITHUB_WEBHOOK_SECRET: ${{ secrets.E2E_GITHUB_WEBHOOK_SECRET }}
      E2E_SLACK_MOCK_URL: http://127.0.0.1:8787
      E2E_WEBHOOK_RECEIVER_URL: http://127.0.0.1:8787
      E2E_MAILPIT_URL: ${{ secrets.E2E_MAILPIT_URL }}
    steps:
      - name: Reject unsupported run mode
        if: ${{ inputs.mode != '' && inputs.mode != 'full' && inputs.mode != 'release' }}
        run: |
          echo "PLN-026 mode must be full or release."
          exit 1

      - name: Require staging base URL
        if: ${{ env.PLN026_STAGING_URL == '' }}
        run: |
          echo "Missing required configuration: PLN026_STAGING_URL (GitHub secret or variable)."
          exit 1

      - name: Require E2E_TEST_PASSWORD
        if: ${{ env.E2E_TEST_PASSWORD == '' }}
        run: |
          echo "Missing required configuration: E2E_TEST_PASSWORD (GitHub secret)."
          exit 1

      - name: Require E2E_SERVICE_TOKEN
        if: ${{ env.E2E_SERVICE_TOKEN == '' }}
        run: |
          echo "Missing required configuration: E2E_SERVICE_TOKEN (GitHub secret)."
          exit 1

      - name: Require E2E_WEBHOOK_SECRET
        if: ${{ env.E2E_WEBHOOK_SECRET == '' }}
        run: |
          echo "Missing required configuration: E2E_WEBHOOK_SECRET (GitHub secret)."
          exit 1

      - name: Require GitHub mock URL
        if: ${{ env.E2E_GITHUB_MOCK_URL == '' }}
        run: |
          echo "Missing required configuration: E2E_GITHUB_MOCK_URL (credential-free local mock at 127.0.0.1:8787)."
          exit 1

      - name: Require GitHub mock webhook secret
        if: ${{ env.E2E_GITHUB_WEBHOOK_SECRET == '' }}
        run: |
          echo "Missing required configuration: E2E_GITHUB_WEBHOOK_SECRET (GitHub secret)."
          exit 1

      - name: Require Slack mock URL
        if: ${{ env.E2E_SLACK_MOCK_URL == '' }}
        run: |
          echo "Missing required configuration: E2E_SLACK_MOCK_URL (credential-free local mock at 127.0.0.1:8787)."
          exit 1

      - name: Require webhook receiver URL
        if: ${{ env.E2E_WEBHOOK_RECEIVER_URL == '' }}
        run: |
          echo "Missing required configuration: E2E_WEBHOOK_RECEIVER_URL (credential-free local mock at 127.0.0.1:8787)."
          exit 1

      - name: Require Mailpit URL
        if: ${{ env.E2E_MAILPIT_URL == '' }}
        run: |
          echo "Missing required configuration: E2E_MAILPIT_URL (GitHub secret)."
          exit 1

  pr-validation:
    name: PR build, tests and E2E smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_ENV: local
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_WORKSPACE_SLUG: e2e
      E2E_PROJECT_NAME: E2E
      E2E_PROJECT_IDENTIFIER: E2E
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      MOCK_INTEGRATIONS_PORT: "8787"
      MOCK_WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
      E2E_GITHUB_MOCK_URL: http://127.0.0.1:8787
      E2E_SLACK_MOCK_URL: http://127.0.0.1:8787
      E2E_WEBHOOK_RECEIVER_URL: http://127.0.0.1:8787
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Prepare local environment files and dependencies
        run: bash setup.sh

      - name: Install Playwright Chromium
        run: pnpm --filter @plane/e2e exec playwright install --with-deps chromium

      - name: Build and type-check
        run: |
          pnpm build
          pnpm --filter web check:types
          pnpm --filter @plane/e2e check:types

      - name: Backend unit and API tests
        run: |
          cp apps/api/.env.example apps/api/.env
          docker compose -f docker-compose-test.yml run --rm --build api-tests \
            pytest plane/tests/unit plane/tests/contract -q

      - name: Start isolated local compose stack
        run: |
          set -euo pipefail
          docker compose -f docker-compose-local.yml up -d --build \
            proxy web api worker migrator plane-db plane-redis plane-mq plane-minio
          for attempt in $(seq 1 60); do
            if curl -fsS "$E2E_BASE_URL" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose-local.yml logs --tail=200
          exit 1

      - name: Seed deterministic E2E data
        run: |
          docker compose -f docker-compose-local.yml exec -T \
            -e E2E_TEST_PASSWORD="$E2E_TEST_PASSWORD" \
            -e PLANE_E2E_ENV=local \
            -e E2E_ALLOW_LOCAL_STAGING=1 \
            api python manage.py seed_e2e --workspace e2e --project E2E --reset

      - name: Start credential-free integration mock
        run: |
          set -euo pipefail
          # MOCK_WEBHOOK_SECRET is supplied from E2E_WEBHOOK_SECRET; never logged.
          pnpm --filter @plane/e2e mock:integrations > "$RUNNER_TEMP/pln026-mock.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pln026-mock.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS "${E2E_WEBHOOK_RECEIVER_URL}/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/pln026-mock.log"
          exit 1

      - name: Run E2E smoke (auth + create + transition)
        run: pnpm test:e2e:smoke

      - name: Stop integration mock
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pln026-mock.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/pln026-mock.pid")" 2>/dev/null || true
          fi

      - name: Upload PR E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pln026-pr-e2e-report
          path: e2e/playwright-report/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload PR E2E traces, screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pln026-pr-e2e-traces
          path: e2e/test-results/**
          retention-days: 7
          if-no-files-found: warn

      - name: Stop local compose stack
        if: always()
        run: docker compose -f docker-compose-local.yml down --remove-orphans

  security-authorization:
    name: Security authorization suite
    if: github.event_name != 'pull_request'
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare test environment
        run: cp apps/api/.env.example apps/api/.env

      - name: Run authorization and isolation tests
        run: |
          docker compose -f docker-compose-test.yml run --rm --build api-tests \
            pytest plane/tests/security plane/tests/unit/utils/test_project_scope.py -q

  full-e2e:
    name: Full E2E shard ${{ matrix.shard }}/4
    if: github.event_name != 'pull_request'
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_ENV: staging
      E2E_BASE_URL: ${{ secrets.PLN026_STAGING_URL || vars.PLN026_STAGING_URL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
      E2E_SERVICE_TOKEN: ${{ secrets.E2E_SERVICE_TOKEN }}
      E2E_WORKSPACE_SLUG: ${{ secrets.PLN026_E2E_WORKSPACE_SLUG || 'e2e' }}
      E2E_PROJECT_NAME: ${{ secrets.PLN026_E2E_PROJECT_NAME || 'E2E' }}
      E2E_PROJECT_IDENTIFIER: ${{ secrets.PLN026_E2E_PROJECT_IDENTIFIER || 'E2E' }}
      E2E_WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
      MOCK_WEBHOOK_SECRET: ${{ secrets.E2E_WEBHOOK_SECRET }}
      E2E_GITHUB_MOCK_URL: http://127.0.0.1:8787
      E2E_GITHUB_WEBHOOK_SECRET: ${{ secrets.E2E_GITHUB_WEBHOOK_SECRET }}
      E2E_SLACK_MOCK_URL: http://127.0.0.1:8787
      E2E_WEBHOOK_RECEIVER_URL: http://127.0.0.1:8787
      E2E_MAILPIT_URL: ${{ secrets.E2E_MAILPIT_URL }}
      E2E_REQUIRE_FULL_CONFIG: "1"
      MOCK_INTEGRATIONS_PORT: "8787"
      E2E_RUN_ID: ${{ github.run_id }}-${{ matrix.shard }}
      E2E_SHARD_INDEX: ${{ matrix.shard }}
      E2E_SHARD_TOTAL: 4
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter @plane/e2e exec playwright install --with-deps chromium

      - name: Start credential-free integration mock
        run: |
          set -euo pipefail
          # MOCK_WEBHOOK_SECRET is supplied from E2E_WEBHOOK_SECRET; never logged.
          pnpm --filter @plane/e2e mock:integrations > "$RUNNER_TEMP/pln026-mock.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pln026-mock.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS "${E2E_WEBHOOK_RECEIVER_URL}/health" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/pln026-mock.log"
          exit 1

      - name: Run full E2E shard
        run: pnpm test:e2e

      - name: Stop integration mock
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/pln026-mock.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/pln026-mock.pid")" 2>/dev/null || true
          fi

      - name: Upload E2E HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pln026-e2e-report-shard-${{ matrix.shard }}
          path: e2e/playwright-report/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload E2E traces, screenshots and video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pln026-e2e-traces-shard-${{ matrix.shard }}
          path: e2e/test-results/**
          retention-days: 7
          if-no-files-found: warn

      - name: Upload shard results for flake tracking
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pln026-e2e-results-shard-${{ matrix.shard }}
          path: e2e/test-results/results.json
          retention-days: 15
          if-no-files-found: warn

  flake-tracking:
    name: 14-day flake dashboard
    if: github.event_name == 'schedule'
    needs: [full-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download current shard results
        uses: actions/download-artifact@v4
        with:
          pattern: pln026-e2e-results-shard-*
          path: ${{ runner.temp }}/pln026-flake/current
          merge-multiple: false

      - name: Download prior 14-day results
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pln026-flake/history"
          since=$(date -u -d '14 days ago' +%Y-%m-%d)
          for run_id in $(gh run list --workflow pln026-e2e.yml --created ">=$since" \
              --json databaseId --jq '.[].databaseId'); do
            if [ "$run_id" = "${{ github.run_id }}" ]; then
              continue
            fi
            artifact_names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" \
              --jq '.artifacts[].name | select(startswith("pln026-e2e-results-"))' || true)
            for artifact_name in $artifact_names; do
              gh run download "$run_id" -n "$artifact_name" \
                -D "$RUNNER_TEMP/pln026-flake/history/$run_id-$artifact_name" || true
            done
          done

      - name: Build flake report
        run: |
          pnpm report:flake -- \
            --input "$RUNNER_TEMP/pln026-flake/current" \
            --input "$RUNNER_TEMP/pln026-flake/history" \
            --output-json "$RUNNER_TEMP/pln026-flake/flake-dashboard.json" \
            --output-markdown "$RUNNER_TEMP/pln026-flake/flake-dashboard.md" \
            --days 14 --threshold 2

      - name: Upload flake dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pln026-flake-dashboard
          path: ${{ runner.temp }}/pln026-flake/flake-dashboard.*
          retention-days: 30
          if-no-files-found: warn

  load-smoke:
    name: Release load smoke
    if: ${{ github.event_name == 'release' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.mode == 'release') }}
    needs: [preflight]
    uses: ./.github/workflows/pln026-load.yml
    with:
      scenario: smoke
      environment: staging
    secrets: inherit

  release-gate:
    name: Release gate
    if: ${{ github.event_name == 'release' || ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && inputs.mode == 'release') }}
    needs: [preflight, full-e2e, security-authorization, load-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PLN026_GATE_OUTPUT: ${{ runner.temp }}/pln026-release-gate.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify no open P0/P1 bugs
        run: pnpm gate:release

      - name: Upload release gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pln026-release-gate
          path: ${{ runner.temp }}/pln026-release-gate.json
          retention-days: 30
          if-no-files-found: warn
